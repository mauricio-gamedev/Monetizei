name: Android CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Unit, HTTP and persistence tests
        run: gradle :protocol:test :server:test :app:testDebugUnitTest --stacktrace
      - name: Build backend distribution
        run: gradle :server:installDist --stacktrace
      - name: Build backend Docker image
        run: docker build -t monetizei-backend:ci .
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: monetizei-debug
          path: app/build/outputs/apk/debug/app-debug.apk
